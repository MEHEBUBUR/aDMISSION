{% extends 'base.html' %}
{% block title %}Application Form{% endblock %}
{% block content %}
<div class="card shadow-sm border-0">
  <div class="card-header kvs-maroon text-white"><h4 class="mb-0">Online Application Form - Class XI</h4></div>
  <div class="card-body">
    <form method="post" enctype="multipart/form-data" id="applicationForm">
      <h5>Student Details</h5>
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Full Name</label><input name="full_name" class="form-control" required></div>
        <div class="col-md-3"><label class="form-label">Date of Birth</label><input type="date" name="dob" class="form-control" required></div>
        <div class="col-md-3"><label class="form-label">Gender</label><select name="gender" class="form-select" required><option>Male</option><option>Female</option><option>Other</option></select></div>
        <div class="col-md-4"><label class="form-label">Aadhaar Number</label><input name="aadhaar_number" maxlength="12" pattern="\d{12}" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Religion</label><input name="religion" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Category</label><select name="category" class="form-select" required><option>GEN</option><option>OBC</option><option>SC</option><option>ST</option><option>EWS</option><option>CwSN</option></select></div>
      </div>

      <hr><h5>Parent Details</h5>
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Father Name</label><input name="father_name" class="form-control" required></div>
        <div class="col-md-6"><label class="form-label">Mother Name</label><input name="mother_name" class="form-control" required></div>
        <div class="col-md-6"><label class="form-label">Occupation</label><input name="occupation" class="form-control"></div>
        <div class="col-md-6"><label class="form-label">Service Category</label><select name="service_category" class="form-select" required><option>Central Govt</option><option>State Govt</option><option>PSU</option><option>Private</option></select></div>
        <div class="col-md-4"><label class="form-label">Mobile Number</label><input name="mobile_number" pattern="\d{10}" maxlength="10" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Address</label><input name="address" class="form-control" required></div>
      </div>

      <hr><h5>Academic Details</h5>
      <div class="row g-3">
        <div class="col-md-3"><label class="form-label">Board Name</label><input name="board_name" class="form-control" required></div>
        <div class="col-md-3"><label class="form-label">Previous School</label><input name="previous_school" class="form-control" required></div>
        <div class="col-md-3"><label class="form-label">Class X Roll Number</label><input name="class_x_roll_number" class="form-control" required></div>
        <div class="col-md-3"><label class="form-label">Year of Passing</label><input type="number" min="2020" max="2026" name="year_of_passing" class="form-control" required></div>
      </div>

      <hr><h5>Marks Entry</h5>
      <div class="row g-3">
        <div class="col-md-2"><label class="form-label">English</label><input type="number" min="0" max="100" step="0.01" name="english" class="form-control marks" required></div>
        <div class="col-md-2"><label class="form-label">Mathematics</label><input type="number" min="0" max="100" step="0.01" name="mathematics" class="form-control marks" required></div>
        <div class="col-md-2"><label class="form-label">Science</label><input type="number" min="0" max="100" step="0.01" name="science" class="form-control marks" required></div>
        <div class="col-md-2"><label class="form-label">Social Science</label><input type="number" min="0" max="100" step="0.01" name="social_science" class="form-control marks" required></div>
        <div class="col-md-2"><label class="form-label">Optional Subject</label><input type="number" min="0" max="100" step="0.01" name="optional_subject" class="form-control marks" required></div>
        <div class="col-md-2"><label class="form-label">Total</label><input id="totalMarks" class="form-control" readonly></div>
        <div class="col-md-2"><label class="form-label">Percentage</label><input id="percentage" class="form-control" readonly></div>
      </div>

      <hr><h5>Stream Selection</h5>
      <div class="row g-3">
        <div class="col-md-4"><select id="stream_selected" name="stream_selected" class="form-select" required><option>Science</option><option>Commerce</option><option>Humanities</option></select></div>
        <div class="col-md-8"><div id="eligibilityHint" class="alert alert-info py-2 mb-0">Science requires 60% aggregate and 60% in Maths+Science.</div></div>
      </div>

      <div class="mt-3">
        <label class="form-label">Sports / NCC Certificate</label>
        <select name="sports_ncc" class="form-select w-auto">
          <option value="no">No</option>
          <option value="yes">Yes</option>
        </select>
      </div>

      <hr><h5>Document Upload</h5>
      <div class="row g-3">
        <div class="col-md-4"><label class="form-label">Class X Marksheet</label><input type="file" name="marksheet" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Transfer Certificate</label><input type="file" name="transfer_certificate" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Aadhaar</label><input type="file" name="aadhaar_doc" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Photo</label><input type="file" name="photo" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Caste Certificate</label><input type="file" name="caste_certificate" class="form-control"></div>
      </div>

      <button class="btn kvs-btn mt-4">Submit Application</button>
    </form>
  </div>
</div>
{% endblock %}
